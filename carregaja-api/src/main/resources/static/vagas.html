<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vagas · CarregaJA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/carregaja.css">
</head>
<body>
<header id="topo" class="topo"></header>
<main id="conteudo" class="conteudo">
<h1 class="pagina-titulo">Vagas com carregador</h1>
<p class="subtitulo">Cadastre as vagas e a potência de cada carregador. Desativar guarda o histórico; remover só vale para vaga sem uso.</p>
<div id="aviso" role="status" aria-live="polite"></div>

<section class="cartao">
  <h2>Nova vaga</h2>
  <form id="nova" novalidate>
    <div class="grade-campos">
      <label class="campo"><span>Identificação</span><input id="identificacao" type="text" maxlength="20" autocomplete="off" placeholder="G-01"></label>
      <label class="campo"><span>Potência do carregador (kW)</span><input id="potencia" type="number" inputmode="decimal" step="any" min="0" placeholder="7,4"></label>
    </div>
    <button class="botao" type="submit">Cadastrar vaga</button>
  </form>
</section>
<section class="secao"><h2>Vagas cadastradas</h2><ul id="lista" class="lista"></ul></section>

</main>
<script type="module" src="/js/vagas.js"></script>
</body>
</html>
