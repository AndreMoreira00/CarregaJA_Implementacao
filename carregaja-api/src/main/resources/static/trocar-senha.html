<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trocar senha · CarregaJA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/carregaja.css">
</head>
<body>
<header id="topo" class="topo"></header>
<main id="conteudo" class="conteudo">
<h1 class="pagina-titulo">Trocar senha</h1>
<p class="subtitulo">Use pelo menos 8 caracteres. A nova senha vale no próximo acesso em qualquer aparelho.</p>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="provisoria" class="aviso aviso-info" hidden>Sua senha é provisória. Escolha uma nova para usar o sistema.</div>
<form id="formulario" class="cartao" style="max-width:480px" novalidate>
  <label class="campo"><span>Senha atual</span><input id="atual" type="password" autocomplete="current-password"></label>
  <label class="campo"><span>Senha nova</span><input id="nova" type="password" autocomplete="new-password"></label>
  <label class="campo"><span>Repita a senha nova</span><input id="repetida" type="password" autocomplete="new-password"></label>
  <button class="botao" type="submit">Trocar senha</button>
</form>
</main>
<script type="module" src="/js/trocar-senha.js"></script>
</body>
</html>
