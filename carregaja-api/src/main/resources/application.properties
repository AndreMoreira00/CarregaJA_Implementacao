spring.application.name=carregaja-api
spring.datasource.url=jdbc:mysql://localhost:3306/carregaja?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_SENHA}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.br.edu.ifsp.carregaja=INFO
server.port=8081

# Fuso do condominio: define o horario de inicio das sessoes e da vigencia da tarifa
carregaja.fuso=America/Sao_Paulo

# Parametro, e nao valor fixo (RE-11, RI-10). O ajuste pelo sindico depende do RF-18, ainda sem caso de uso
carregaja.sessao.duracao-maxima-horas=6

# Assinatura do token de acesso: pelo menos 32 caracteres, sempre por variavel de ambiente
carregaja.jwt.segredo=${CARREGAJA_JWT_SEGREDO}
carregaja.jwt.validade-horas=12

# Primeiro sindico, criado so se ainda nao houver nenhum. A senha e provisoria: troca no primeiro acesso
carregaja.sindico.nome=${CARREGAJA_SINDICO_NOME:Sindico}
carregaja.sindico.email=${CARREGAJA_SINDICO_EMAIL:}
carregaja.sindico.senha=${CARREGAJA_SINDICO_SENHA:}
